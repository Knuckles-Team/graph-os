# Repository-root directory-justification manifest, read by
# scripts/check_root_hygiene.py.
#
# This is NOT a ratchet. A ratchet (a "baseline" a gate compares against
# instead of an absolute standard) hides existing findings from view and only
# ever grows by a gate silently re-recording whatever is currently true. This
# file does the opposite on both counts:
#   * it hides no finding -- every tracked root entry not listed here is a
#     gate FAILURE, not a suppressed one;
#   * it grows only by a deliberate human (or human-reviewed) edit that adds
#     a one-line reason, never by a tool re-writing it to match the tree;
#   * a listed entry that stops being tracked is ALSO a gate failure (see
#     check_root_hygiene.py's stale-entry check).
#
# Every tracked root directory, and every tracked non-dot root file, must have
# a line here. Conventional, self-describing dot-FILES (.gitignore,
# .pre-commit-config.yaml, ...) are instead enumerated in
# scripts/check_root_hygiene.py's ALLOWED_DOTFILES -- see that module's
# docstring for why the split. Adapted from agent-utilities'/epistemic-graph's
# own .repo-layout.toml for this repository's own (much smaller) tracked root.

[dirs]
graph_os = "the graph_os Python package: RF-ADR-009 Phase 5 module skeleton (mcp_server, fleet, gateway, control_plane, webui_host, deployment) plus the graph-os console entry point"
tests = "the pytest suite: wiring tests proving the console entry point and every package under graph_os/ are live, imported members of the package"
docker = "docker/DESIGN.md — a design note only; no Dockerfile ships yet (see that file for why, and what moves here in Migration Wave 5)"
docs = "GitHub Pages source (mkdocs) — the published site is this repository's documentation surface, not this directory read directly (RF-ADR-009 §5)"
scripts = "gate scripts (check_*.py, scanner_contract.py, ...) invoked by pre-commit/CI — see AGENTS.md 'Scanner hooks' for provenance"
".github" = "GitHub Actions workflow definitions (release.yml, pages.yml)"
".kiss" = "hand-authored KISS structural-rule thresholds (.kiss/kiss.toml); every other entry would be a regenerated analysis cache and stays gitignored"

[files]
"AGENTS.md" = "agent-facing repo guide: RF-ADR-009 scope, module mapping, W5 source measurements, pre-commit hook accounting"
"CHANGELOG.md" = "release changelog, updated by the bump2version release flow"
"CLAUDE.md" = "Claude Code project instructions (@AGENTS.md import)"
"README.md" = "project readme"
"pyproject.toml" = "package metadata, dependencies (currently none — see AGENTS.md), and the [tool.graph_os.scanners] pinned-tool contract"
"mkdocs.yml" = "mkdocs site config for the GitHub Pages source in docs/"
"uv.lock" = "uv lockfile"
"dupehound-distinct.toml" = "reviewed-duplicate register read by scripts/check_dupehound.py — currently empty (see that file's own header)"
