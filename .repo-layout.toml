# Repository-root justification manifest, read by the shared root-hygiene hook
# (Knuckles-Team/pipelines).
#
# This is NOT a ratchet. A ratchet (a "baseline" a gate compares against
# instead of an absolute standard) hides existing findings from view and only
# ever grows by a gate silently re-recording whatever is currently true. This
# file does the opposite on both counts:
#   * it hides no finding -- every tracked root entry not listed here is a
#     gate FAILURE, not a suppressed one;
#   * it grows only by a deliberate human (or human-reviewed) edit that adds
#     a one-line reason, never by a tool re-writing it to match the tree;
#   * a listed entry that stops being tracked is ALSO a gate failure.
#
# Every tracked root directory, non-dot root file and root dot-file (this
# manifest itself excepted) must have a line here.

[dirs]
graph_os = "the GraphOS Python package: MCP/REST composition, fleet, gateway, control plane, WebUI host, A2A, browser control, deployment, and console entry points"
tests = "the pytest suite: wiring tests proving the console entry point and every package under graph_os/ are live, imported members of the package"
deploy = "graph-os deployment profile inputs (dev/test/prod) consumed by graph_os.deployment.genesis_environments"
docker = "container delivery design and ownership notes; this repository does not publish a container image"
docs = "MkDocs source for the public GitHub Pages documentation site"
".github" = "GitHub Actions workflow definitions (release.yml, pages.yml)"
".kiss" = "hand-authored KISS structural-rule thresholds (.kiss/kiss.toml); every other entry would be a regenerated analysis cache and stays gitignored"

[files]
"AGENTS.md" = "agent-facing repository architecture, commands, quality gates, and safe-development contract"
"CHANGELOG.md" = "release changelog, updated by the bump2version release flow"
"CLAUDE.md" = "Claude Code project instructions (@AGENTS.md import)"
"LICENSE" = "MIT license text included in source distributions and wheels"
"README.md" = "project readme"
"genesis.yaml" = "graph-os deployment run-plan manifest consumed by graph_os.deployment.genesis_environments"
"pyproject.toml" = "package metadata, deployment runtime dependencies/scripts, and the [tool.pipelines_hooks] shared-hook configuration"
"mkdocs.yml" = "mkdocs site config for the GitHub Pages source in docs/"
"uv.lock" = "uv lockfile"
"dupehound-distinct.toml" = "reviewed register of dupehound pairs that are not clones, read by the shared dupehound-changed hook — currently empty (see that file's own header)"
"vulture_whitelist.py" = "load-bearing keyword-callable Protocol parameter names consumed by the shared vulture hook"

[dotfiles]
".bumpversion.cfg" = "bump2version release configuration"
".gitignore" = "git exclusion patterns (carries the fleet-shared REQUIRED set)"
".pre-commit-config.yaml" = "the combined pre-commit and pre-push suite, including the pinned shared hooks"
".security-audit-allow.txt" = "risk-acceptance ledger read by the shared dependency-audit hook — currently empty"
