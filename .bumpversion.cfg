[bumpversion]
current_version = 0.1.0
commit = True
tag = True

[bumpversion:file:graph_os/_version.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:README.md]
search = *Version: {current_version}*
replace = *Version: {new_version}*

[bumpversion:file:CHANGELOG.md]
# `search` MUST differ from `replace` or the bump is a silent no-op (see
# agent-utilities' own `.bumpversion.cfg`, which documents the same lesson
# learned the hard way — versions 2.2.0-2.5.0 there got no CHANGELOG entry
# for exactly this reason). This keeps `## [Unreleased]` in place and
# inserts the new version heading below it.
search = ## [Unreleased]
replace = ## [Unreleased]

	## [{new_version}] - {now:%Y-%m-%d}
