{{- $unified := include "graph-os.unified" . -}}
{{- $sidecar := include "graph-os.sidecar" . -}}
{{- $engineTls := and $unified .Values.engine.tcp.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "graph-os.fullname" . }}-graphos
  labels:
    {{- include "graph-os.labels" . | nindent 4 }}
    app.kubernetes.io/component: graphos
spec:
  replicas: {{ if $unified }}1{{ else }}{{ .Values.graphos.replicas }}{{ end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: graphos
  strategy:
    # The unified pod holds the engine store's single-writer lock: never overlap.
    type: {{ if $unified }}Recreate{{ else }}RollingUpdate{{ end }}
  template:
    metadata:
      labels:
        {{- include "graph-os.labels" . | nindent 8 }}
        app.kubernetes.io/component: graphos
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "graph-os.podSpecHeader" . | nindent 6 }}
      {{- if $sidecar }}
      initContainers:
        # Native sidecar: starts before graph-os, stops after it, restarts on its own.
        - name: engine
          image: {{ include "graph-os.engineImage" . }}
          imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
          restartPolicy: Always
          command:
            {{- include "graph-os.engineArgs" . | nindent 12 }}
          {{- include "graph-os.engineEnvFrom" . | nindent 10 }}
          {{- if .Values.engine.tcp.enabled }}
          ports:
            - {name: engine, containerPort: {{ .Values.engine.port }}}
          {{- end }}
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "test -S /run/epistemic-graph/epistemic-graph.sock"]
            # A large store recovers for minutes on a cold start.
            failureThreshold: 360
            periodSeconds: 5
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          volumeMounts:
            {{- include "graph-os.sharedVolumeMounts" . | nindent 12 }}
            {{- if .Values.engine.tcp.enabled }}
            - {name: engine-tls, mountPath: /etc/graph-os/engine-tls, readOnly: true}
            {{- end }}
      {{- end }}
      containers:
        - name: graphos
          image: {{ include "graph-os.image" .Values.graphos.image }}
          imagePullPolicy: {{ .Values.graphos.image.pullPolicy }}
          command:
            {{- toYaml .Values.graphos.args | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "graph-os.fullname" . }}-graphos
            - secretRef:
                name: {{ .Values.runtimeSecret.name }}
                optional: {{ .Values.runtimeSecret.optional }}
          ports:
            - name: http
              containerPort: {{ .Values.graphos.port }}
            {{- if .Values.graphos.webUi }}
            - name: webui
              containerPort: {{ .Values.graphos.webUiPort }}
            {{- end }}
            {{- if and $unified (not $sidecar) .Values.engine.tcp.enabled }}
            - name: engine
              containerPort: {{ .Values.engine.port }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders: [{name: Host, value: {{ .Values.graphos.probeHostHeader | quote }}}]
            failureThreshold: 360
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders: [{name: Host, value: {{ .Values.graphos.probeHostHeader | quote }}}]
            failureThreshold: 6
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders: [{name: Host, value: {{ .Values.graphos.probeHostHeader | quote }}}]
            failureThreshold: 3
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.graphos.resources | nindent 12 }}
          volumeMounts:
            {{- include "graph-os.sharedVolumeMounts" . | nindent 12 }}
            {{- if and $engineTls (not $sidecar) }}
            - {name: engine-tls, mountPath: /etc/graph-os/engine-tls, readOnly: true}
            {{- end }}
            {{- with .Values.graphos.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: engine-socket
          emptyDir: {}
        - name: graphos-data
          {{- if $unified }}
          persistentVolumeClaim:
            claimName: {{ include "graph-os.fullname" . }}-graphos
          {{- else }}
          # Shared topology: graph-os replicas are stateless.
          emptyDir: {}
          {{- end }}
        {{- if $engineTls }}
        - name: engine-tls
          secret:
            secretName: {{ .Values.engine.tls.secretName }}
        {{- end }}
        {{- with .Values.graphos.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.graphos.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.graphos.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.graphos.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "graph-os.fullname" . }}-graphos
  labels:
    {{- include "graph-os.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: graphos
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if .Values.graphos.webUi }}
    - name: webui
      port: {{ .Values.service.webUiPort }}
      targetPort: webui
    {{- end }}
    {{- if and $unified .Values.engine.tcp.enabled }}
    # In-cluster fleet connectors reach the pod's engine here (TLS + signed envelopes).
    - name: engine
      port: {{ .Values.engine.port }}
      targetPort: engine
    {{- end }}
{{- if $unified }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "graph-os.fullname" . }}-graphos
  labels:
    {{- include "graph-os.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.graphos.persistence.accessModes | nindent 4 }}
  {{- with .Values.graphos.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.graphos.persistence.size }}
{{- end }}
