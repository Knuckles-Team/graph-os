INHERIT: .pipeline-theme/templates/mkdocs-theme/base.mkdocs.yml

site_name: Graph OS
site_description: >-
  The governed MCP, REST, A2A, fleet, and Agent Web UI runtime for the Knuckles
  agent platform.
site_url: https://knuckles-team.github.io/graph-os/
repo_name: Knuckles-Team/graph-os
repo_url: https://github.com/Knuckles-Team/graph-os
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
copyright: Copyright &copy; Knuckles-Team — MIT licensed

plugins:
  - search

extra:
  ecosystem:
    current: graph-os

nav:
  - Home: index.md
  - Start Graph OS: get-started.md
  - How it fits: architecture.md
  - Use Graph OS:
      - MCP server: mcp-server.md
      - REST gateway: gateway.md
      - Fleet gateway: fleet.md
      - Unary A2A: a2a.md
      - Browser control: browser-control-service.md
  - Operate:
      - Deployment and configuration: deployment.md
      - Capability status: status.md
      - Quality gate terms: quality-gate-terms.md
  - Glossary: glossary.md
