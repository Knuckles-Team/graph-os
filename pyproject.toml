[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-os"
dynamic = ["version"]
description = "The deployable MCP, REST, control-plane, fleet, WebUI, and operations composition for the Knuckles agent platform."
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12,<3.15"
license = "MIT"
# Runtime requirements imported by the gateway, control plane, and deployment
# surfaces. Connector widgets delegate through the served fleet and never
# install connector clients.
dependencies = [
    # Portable development binding below resolves the not-yet-published AU 2.5
    # workspace release; released wheels retain this real PEP 508 floor.
    "agent-utilities[mcp]>=2.5.0,<3.0.0",
    # GraphOS is the deployment composition root for connector workers.  The
    # SDK owns source transport and runner construction; GraphOS supplies its
    # authenticated epistemic-graph client through the SDK's public injection
    # seam and never imports connector implementations.
    "agent-connector-sdk>=0.1.0,<1.0.0",
    # The fleet gateway imports the MCP protocol/client and FastMCP middleware
    # directly; keep these first-party runtime requirements explicit rather
    # than relying on AU's optional extra to expose them transitively.
    "anyio>=4.13.0",
    # Production operations and the canary call the public client/numeric
    # surface directly; AU's transitive requirement is not enough for this
    # package's own imports.  The local AU binding supplies the workspace EG
    # source through its own .uv-workspace-siblings declaration.
    "epistemic-graph>=2.27.0,<3.0.0",
    "fastapi>=0.139.2",
    "filelock>=3.32.0",
    "prometheus-client>=0.25.0",
    "pydantic>=2.13.4,<3.0.0",
    "PyYAML>=6.0.3",
    "starlette>=1.3.1",
    "fastmcp>=4.0.0b1",
    "mcp>=2.0.0",
    "opentelemetry-api>=1.39.1",
    "pydantic-ai-slim[openai]==2.29.0",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@example.invalid"

[project.optional-dependencies]
# Test-only, real tooling versions matched to agent-utilities' floors
# (agent-packages/agent-utilities/pyproject.toml `[project.optional-dependencies].test`)
# so a lockstep upgrade there is easy to mirror here later.
test = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
    "ruff==0.16.0",
    "types-PyYAML>=6.0.12.20250915",
]
webui = [
    "agent-webui>=2.6.0,<3.0.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
graph-os = "graph_os.mcp_server.server:mcp_server"
graph-os-daemon = "graph_os.gateway.daemon:main"
graph-os-release-canary = "graph_os.deployment.release_canary:main"
graph-os-production-ops = "graph_os.deployment.production_ops:main"
setup-config = "graph_os.deployment.cli:main"
agent-utilities-doctor = "graph_os.deployment.doctor:main"
agent-utilities-venv = "graph_os.deployment.venv_sync:main"

# Portable development binding for the not-yet-published AU 2.5 release.
# The path is ignored and supplied as a local symlink; package metadata keeps
# the real PEP 508 floor above, so released wheels resolve from the index.
[tool.uv.sources]
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }
agent-connector-sdk = { path = ".uv-workspace-siblings/agent-connector-sdk", editable = true }
agent-webui = { path = ".uv-workspace-siblings/agent-webui", editable = true }

[tool.setuptools.dynamic]
version = { attr = "graph_os._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_os*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
graph_os = ["ontology/**/*.ttl"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Deployment modules use long operator remediations and guarded imports. Keep
# these narrow exceptions while retaining import, correctness, and modern
# Python checks across GraphOS.
ignore = ["E402", "E501", "B007"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

# Inputs of the shared hooks (Knuckles-Team/pipelines .pre-commit-hooks.yaml).
[tool.pipelines_hooks]
packages = ["graph_os"]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/graph-os"
distribution = "graph-os"
pages_url = "https://knuckles-team.github.io/graph-os/"
mcp_server = true

# The MCP server and gateway serve stdio/HTTP; stdout there is protocol output.
[tool.pipelines_hooks.stdout_writes]
served_paths = ["graph_os/mcp_server", "graph_os/gateway"]

[tool.pipelines_hooks.ci_replica]
build_affecting = ["pyproject.toml", "uv.lock", "mkdocs.yml", "docs/**", "overrides/**", ".github/workflows/**", ".pre-commit-config.yaml"]

[tool.pipelines_hooks.ci_replica.workflows."release.yml"]
blocking = true
executable_jobs = ["gates", "build"]

[tool.pipelines_hooks.ci_replica.workflows."release.yml".skip_reasons]
scanner-quality = "provisions the pinned cccc/kiss/dupehound/jscpd toolchain on the runner (cargo install, npm install); local replay never installs tools, and the pre-push hooks run the same shared gates against the locally installed, version-verified binaries"
publish-pypi = "requires a vX.Y.Z release tag and the pypi-publish environment; publishing must never happen from a local hook"

[tool.pipelines_hooks.ci_replica.workflows."pages.yml"]
blocking = false
executable_jobs = []

[tool.pipelines_hooks.ci_replica.workflows."pages.yml".skip_reasons]
deploy = "calls the immutable shared Pages workflow; theme synchronization and the strict site build are verified directly, while hosted deployment requires the github-pages environment"
