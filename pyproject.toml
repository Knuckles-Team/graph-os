[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-os"
dynamic = ["version"]
description = "graph-os: the deployable composition for the agent-utilities agent plane — MCP server, REST gateway, control plane, fleet gateway, agent-webui hosting, and deployment tooling (RF-ADR-009)."
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12,<3.15"
license = "MIT"
# Pre-W5 scaffold (RF-ADR-009 plans/refactor/RF-ADR-009-connector-sdk-and-graph-os.md):
# no runtime dependencies yet. Wire-First: a dependency is declared only once code
# that imports it lands. See "Target dependencies (planned, W5)" in AGENTS.md for
# the full mapping (agent-utilities agent plane, agent-connector-sdk, the
# `epistemic_graph` client) — none of those packages are installed here today;
# agent-connector-sdk does not exist yet (RF-ADR-009 §3 phase 3, W2).
dependencies = []

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@example.invalid"

[project.optional-dependencies]
# Test-only, real tooling versions matched to agent-utilities' floors
# (agent-packages/agent-utilities/pyproject.toml `[project.optional-dependencies].test`)
# so a lockstep upgrade there is easy to mirror here later.
test = [
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
    "ruff==0.16.0",
]

[project.scripts]
graph-os = "graph_os.cli:main"

[tool.setuptools.dynamic]
version = { attr = "graph_os._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_os*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Pinned native scanner contract, read by scripts/scanner_contract.py.
# Versions MUST match epistemic-graph's scripts/scanner_contract.py /
# pyproject.toml [tool.epistemic_graph.scanners] exactly (per this lane's
# instructions) — a hook fails closed on any drift from these exact values
# (scanner_contract.exact_version). dependency_cruiser_version /
# import_linter_version / arch_lint_version / cargo_deny_version are
# deliberately ABSENT: those pin Rust/JS architecture tools this repository
# has no source for. See AGENTS.md "Scanner hooks" for the full accounting.
[tool.graph_os.scanners]
cccc_version = "1.6.0"
kiss_version = "0.4.10"
dupehound_version = "0.1.2"
dupehound_threshold = 0.85
dupehound_min_tokens = 40
jscpd_version = "5.0.16"
jscpd_min_tokens = 50
jscpd_min_lines = 5
jscpd_mode = "mild"

# jscpd's differential/census scope. Deliberately excludes this repository's
# own generated/ephemeral trees (mirrors epistemic-graph's exclusion set,
# trimmed to what graph-os actually has). MUST precede the subtables below —
# TOML does not allow re-entering a parent table's keys after a subtable of
# it has been opened.
jscpd_exclusions = [
    "**/.git/**",
    "**/.venv/**",
    "**/venv/**",
    "**/__pycache__/**",
    "**/build/**",
    "**/dist/**",
    "**/.cache/**",
    "**/cache/**",
    "**/*.egg-info/**",
    "site/**",
    "**/*.lock",
    "**/fixtures/**",
    "**/fixture/**",
]

[tool.graph_os.scanners.jscpd_formats]
python = ["py", "pyi"]
yaml = ["yaml", "yml"]
toml = ["toml"]
markdown = ["md"]
bash = ["sh", "bash"]
json = ["json"]

[tool.graph_os.scanners.jscpd_filenames]
docker = ["Dockerfile", "Containerfile"]
