[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-os"
dynamic = ["version"]
description = "The deployable MCP, REST, control-plane, fleet, WebUI, and operations composition for the Knuckles agent platform."
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12,<3.15"
license = "MIT"
# Runtime requirements imported by the gateway, control plane, and deployment
# surfaces. Connector widgets delegate through the served fleet and never
# install connector clients.
dependencies = [
    # Portable development binding below resolves the not-yet-published AU 2.5
    # workspace release; released wheels retain this real PEP 508 floor.
    "agent-utilities[mcp]>=2.5.0,<3.0.0",
    # GraphOS is the deployment composition root for connector workers.  The
    # SDK owns source transport and runner construction; GraphOS supplies its
    # authenticated epistemic-graph client through the SDK's public injection
    # seam and never imports connector implementations.
    "agent-connector-sdk>=0.1.0,<1.0.0",
    # The messaging channel layer's HTTP alert intake (graph_os/messaging/alert_intake.py)
    # imports aiohttp.web directly for its small webhook listener; platform-agnostic,
    # so unlike the chat-platform SDKs below this is not conditioned on a messaging extra.
    "aiohttp>=3.14.1",
    # The fleet gateway imports the MCP protocol/client and FastMCP middleware
    # directly; keep these first-party runtime requirements explicit rather
    # than relying on AU's optional extra to expose them transitively.
    "anyio>=4.13.0",
    # Production operations and the canary call the public client/numeric
    # surface directly; AU's transitive requirement is not enough for this
    # package's own imports.  The local AU binding supplies the workspace EG
    # source through its own .uv-workspace-siblings declaration.
    "epistemic-graph>=2.27.0,<3.0.0",
    "fastapi>=0.139.2",
    "filelock>=3.32.0",
    "prometheus-client>=0.25.0",
    "pydantic>=2.13.4,<3.0.0",
    "PyYAML>=6.0.3",
    "starlette>=1.3.1",
    "fastmcp>=4.0.0b1",
    "mcp>=2.0.0",
    "opentelemetry-api>=1.39.1",
    "pydantic-ai-slim[openai]==2.54.0",
    # Installed so its ``agent_utilities.skill_providers`` entry point (once
    # declared in universal-skills' own package) resolves in THIS process,
    # the same way agent-utilities', epistemic-graph's, and graph-os's own
    # skills already do — see graph_os/fleet/local_skill_catalog.py. No
    # transitive dependencies of its own.
    "universal-skills>=1.3.1,<2.0.0",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@example.invalid"

[project.optional-dependencies]
# Test-only, real tooling versions matched to agent-utilities' floors
# (agent-packages/agent-utilities/pyproject.toml `[project.optional-dependencies].test`)
# so a lockstep upgrade there is easy to mirror here later.
test = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
    "ruff==0.16.0",
    "types-PyYAML>=6.0.12.20250915",
    # DEV/TEST-ONLY. setuptools is already a `[build-system] requires` floor
    # (>=83.0.0) for this project's own PEP 517 backend — build requirements
    # are installed only into an ephemeral build environment, not the runtime
    # venv. tests/test_dependency_manifest.py reads
    # `setuptools.config.pyprojecttoml` directly to prove the published
    # manifest contract (host-composition-boundary spec, dependency-manifest
    # requirement), and tests/gateway/test_gateway_widgets_extra.py does the same, so the same floor must also be reachable at test time.
    "setuptools>=83.0.0",
]
webui = [
    "agent-webui>=2.6.0,<3.0.0",
    "uvicorn>=0.51.0",
]
# portable-deployment spec, gateway-widgets extra requirement: graph_os/gateway/widgets/*.py
# each call BaseWidget._fleet_client() (graph_os/fleet) for live data -- the served
# fleet admission seam, never a direct connector-package import (see the
# `dependencies` comment above). No widget today transitively needs a
# fleet connector package's own distribution, but any future widget that
# does must resolve a connector built against agent-connector-sdk's current,
# post-split module layout, not a pre-split agent-utilities-runtime shape.
# This extra is GraphOS's side of that floor -- the agent-utilities
# `gateway-widgets` extra it replaces (retired there under the AU boundary /
# host-composition-boundary spec) pinned the same SDK transitively
# through each connector package's own dependency on it. Full requirement
# IDs: specs/portable-deployment/requirements.md,
# specs/host-composition-boundary/requirements.md.
gateway-widgets = [
    "agent-connector-sdk>=0.1.0,<1.0.0",
]
# Messaging channel adapters (CONCEPT:AU-ECO.messaging.native-backend-abstraction):
# each chat platform SDK is its own extra so importing graph_os.messaging never
# requires every platform's client library to be installed. Further platforms
# (Discord, Slack, WhatsApp, Teams, Google Chat/Meet, Matrix, IRC, Signal,
# iMessage, LINE, Twitch, Synology Chat, voice calls, Nextcloud Talk) follow
# the same adapter shape and remain to be landed.
messaging-telegram = ["python-telegram-bot>=22.8"]
messaging-mattermost = ["mattermostdriver>=7.3.2"]
messaging = [
    "graph-os[messaging-telegram,messaging-mattermost]"
]

[project.scripts]
graph-os = "graph_os.mcp_server.server:mcp_server"
graph-os-daemon = "graph_os.gateway.daemon:main"
graph-os-release-canary = "graph_os.deployment.release_canary:main"
graph-os-production-ops = "graph_os.deployment.production_ops:main"
setup-config = "graph_os.deployment.cli:main"
agent-utilities-doctor = "graph_os.deployment.doctor:main"
agent-utilities-venv = "graph_os.deployment.venv_sync:main"
graph-os-wiring-sweep = "graph_os.evolution.wiring_sweep:main"
graph-os-connector-count-pins = "graph_os.fleet.connector_count_pins:main"
graph-os-check-import-boundaries = "graph_os.architecture.boundary_census:main"
graph-os-hosting-config = "graph_os.deployment.host_config:main"
graph-os-capability-layers = "graph_os.architecture.capability_layers:main"

[project.entry-points."agent_utilities.skill_providers"]
graph-os = "graph_os.skills"

[project.entry-points."agent_utilities.messaging"]
telegram = "graph_os.messaging.backends.telegram:TelegramBackend"
mattermost = "graph_os.messaging.backends.mattermost:MattermostBackend"

[project.entry-points."agent_utilities.messaging.reach"]
notify_sync = "graph_os.messaging.reach:notify_sync"
service = "graph_os.messaging.reach:service_port"

# Portable development binding for the not-yet-published AU 2.5 release.
# The path is ignored and supplied as a local symlink; package metadata keeps
# the real PEP 508 floor above, so released wheels resolve from the index.
[tool.uv.sources]
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }
agent-connector-sdk = { path = ".uv-workspace-siblings/agent-connector-sdk", editable = true }
agent-webui = { path = ".uv-workspace-siblings/agent-webui", editable = true }

[tool.setuptools.dynamic]
version = { attr = "graph_os._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_os*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
graph_os = ["ontology/**/*.ttl", "skills/**"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Deployment modules use long operator remediations and guarded imports. Keep
# these narrow exceptions while retaining import, correctness, and modern
# Python checks across GraphOS.
ignore = ["E402", "E501", "B007"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

# Inputs of the shared hooks (Knuckles-Team/pipelines .pre-commit-hooks.yaml).
[tool.pipelines_hooks]
packages = ["graph_os"]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/graph-os"
distribution = "graph-os"
pages_url = "https://knuckles-team.github.io/graph-os/"
mcp_server = true

# The MCP server and gateway serve stdio/HTTP; stdout there is protocol output.
[tool.pipelines_hooks.stdout_writes]
served_paths = ["graph_os/mcp_server", "graph_os/gateway"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
