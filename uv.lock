version = 1
revision = 3
requires-python = ">=3.12, <3.15"
resolution-markers = [
    "python_full_version >= '3.14'",
    "python_full_version < '3.14'",
]

[[package]]
name = "agent-connector-sdk"
source = { editable = ".uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/agent-connector-sdk" }
dependencies = [
    { name = "anyio" },
    { name = "cryptography" },
    { name = "epistemic-graph" },
    { name = "fastmcp" },
    { name = "httpx" },
    { name = "httpx2" },
    { name = "pydantic" },
    { name = "pyyaml" },
]

[package.metadata]
requires-dist = [
    { name = "anyio", specifier = ">=4.13.0" },
    { name = "cryptography", specifier = ">=50.0.1" },
    { name = "epistemic-graph", specifier = ">=2.27.0,<3" },
    { name = "fastmcp", specifier = ">=4.0.3,<5" },
    { name = "httpx", specifier = ">=0.28.1" },
    { name = "httpx2", specifier = ">=2.12.0" },
    { name = "pydantic", specifier = ">=2.13.4,<3" },
    { name = "pyyaml", specifier = ">=6.0.3" },
]

[package.metadata.requires-dev]
docs = [{ name = "mkdocs-material", specifier = "==9.7.7" }]
test = [
    { name = "pytest", specifier = ">=9.1.1" },
    { name = "pytest-asyncio", specifier = ">=1.4.0" },
    { name = "pytest-timeout", specifier = ">=2.4.0" },
]

[[package]]
name = "agent-utilities"
source = { editable = ".uv-workspace-siblings/agent-utilities" }
dependencies = [
    { name = "agent-connector-sdk" },
    { name = "click" },
    { name = "cryptography" },
    { name = "defusedxml" },
    { name = "epistemic-graph" },
    { name = "filelock" },
    { name = "graphql-core" },
    { name = "idna" },
    { name = "joserfc" },
    { name = "jsonschema" },
    { name = "msgpack" },
    { name = "packaging" },
    { name = "pathspec" },
    { name = "pillow" },
    { name = "platformdirs" },
    { name = "psutil" },
    { name = "pydantic", extra = ["email"] },
    { name = "pydantic-settings" },
    { name = "pypdf" },
    { name = "pyyaml" },
    { name = "requests" },
    { name = "urllib3" },
]

[package.optional-dependencies]
mcp = [
    { name = "eunomia-core" },
    { name = "fastapi" },
    { name = "fastmcp" },
    { name = "httpx" },
    { name = "pydantic-ai-slim", extra = ["openai"] },
    { name = "pyjwt" },
    { name = "python-multipart" },
    { name = "starlette" },
]

