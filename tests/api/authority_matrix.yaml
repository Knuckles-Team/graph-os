# GRAPHOS-OPS-R027 / GRAPHOS-FLEET-R017: the authority-parity oracle fixture.
#
# Each row is one (principal rule, operation surfaces, serving surface,
# caller) combination and the single correct allow/deny outcome. A probe
# operation is served on `op_surfaces`, requires `op_scopes`, and restricts
# callers per `principal_rule`. `test_authority_parity.py` asserts the
# registry's real authorization chokepoint (surface membership +
# `graph_os.api.registry.authorized`) reaches exactly `expected` for every
# row, so authorization cannot silently diverge for one principal kind,
# operation or surface while looking correct for another.
#
# `specs` lists the spec IDs this row binds to (a case can serve more than
# one spec when both lineages independently covered the same combination).
- name: any-human-on-mcp-with-scope-allows
  specs: [GRAPHOS-FLEET-R017, GRAPHOS-OPS-R027]
  principal_rule: any
  op_scopes: [ops:probe]
  op_surfaces: [mcp, http]
  caller_kind: human
  caller_delegated: false
  caller_scopes: [ops:probe]
  caller_surface: mcp
  policy: allow
  expected: true

- name: any-rule-allows-delegated-human
