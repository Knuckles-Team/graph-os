name: Release

# ─────────────────────────────────────────────────────────────────────────
# Modeled on agent-utilities'/epistemic-graph's release.yml two-workflow
# split: this file is the ONLY workflow that can block a release
# (gates -> build -> publish-pypi, wired with `needs:` so a failure names its
# stage at a glance). Scanner quality blocks like every other job here now
# that the fleet's own kiss fork build keeps it green; its native toolchain
# is still runner-provisioned. Everything else (Pages) lives in its own
# workflow.
#
# CI runs this repository's own .pre-commit-config.yaml -- the commit and
# push stages over every file, then the manual-stage hooks that need the
# provisioned environment -- so CI and local hooks can never run different
# gate code. Shared gates come from Knuckles-Team/pipelines at `main` -- the
# one sanctioned exception to this repository's immutable-pin policy.
# `scanner-quality` provisions the pinned cccc/kiss (the fleet's own fork
# build)/dupehound/jscpd toolchain on the runner (hooks never install
# scanners) and runs their census and differential forms; the diff-scoped
# `complexity-staged` / `kiss-staged` hooks compare the staged index with
# HEAD, which is empty on a fresh checkout.
#
# The package is pure Python; the only Rust build is epistemic-graph's
# numeric kernel for the source-overlay test environment. Container images
# have a separate delivery owner and are not published by this wheel workflow.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    name: gates
    # Homelab self-hosted runner for same-repo push/PR traffic (the org
    # runner group is scoped to the 6 core repos already); a fork PR's head
    # repo never matches `github.repository`, so it always lands on the
    # GitHub-hosted runner -- self-hosted capacity is never offered to an
    # untrusted fork without the separate first-run approval gate.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      # YAML anchors, reused by `scanner-quality` and `build`: jscpd's
      # differential gate flags a copy-pasted preamble as a new same-file
      # duplicate; this is the fix, not a jscpd exclusion.
      - &release-checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - &release-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - &release-uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Provision pinned Helm for deployment render tests
        env:
          HELM_VERSION: v4.3.0
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/helm.XXXXXX")"
          archive="$tool_dir/helm.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" linux-amd64/helm
          test "$("$tool_dir/linux-amd64/helm" version --template '{{.Version}}')" = "$HELM_VERSION"
          printf '%s\n' "$tool_dir/linux-amd64" >> "$GITHUB_PATH"

      - name: Checkout pinned agent-utilities source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/agent-utilities
          ref: b210b1ecd8e8255ea40f64c4976b5f98f7b45501
          path: .uv-workspace-siblings/agent-utilities
          persist-credentials: false

      - name: Checkout pinned agent-connector-sdk source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/agent-connector-sdk
          ref: 403908c0a53746cbee97256d539da28976d5ad80
          path: .uv-workspace-siblings/agent-connector-sdk
          persist-credentials: false

      - name: Checkout pinned agent-webui source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/agent-webui
          ref: 03cc841a38cecabc0b62a541814512670ebc8774
          path: .uv-workspace-siblings/agent-webui
          persist-credentials: false

      - name: Checkout pinned epistemic-graph source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/epistemic-graph
          ref: 70037e8a400c7b32b1222623bb05bbfaf55deab8
          path: .uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/epistemic-graph
          persist-credentials: false

      - name: Materialize nested pinned source paths
        run: |
          set -euo pipefail
          au_source="$GITHUB_WORKSPACE/.uv-workspace-siblings/agent-utilities"
          sdk_source="$GITHUB_WORKSPACE/.uv-workspace-siblings/agent-connector-sdk"
          webui_source="$GITHUB_WORKSPACE/.uv-workspace-siblings/agent-webui"
          mkdir -p "$au_source/.uv-workspace-siblings" "$webui_source/.uv-workspace-siblings"
          ln -s "$sdk_source" "$au_source/.uv-workspace-siblings/agent-connector-sdk"
          ln -s "$au_source" "$webui_source/.uv-workspace-siblings/agent-utilities"

      # The base the differential hooks compare against: the pull request base
      # or the previous push, else the root commit (a first push scans all of
      # it). An unavailable object is never an invented empty baseline.
      - &release-base
        name: Resolve the published base
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "PRE_COMMIT_FROM_REF=$BASE" >> "$GITHUB_ENV"

      # The prohibited-identity catalog is operator-owned and never committed;
      # a missing catalog makes the tracked-privacy hook fail closed.
      - name: Commit- and push-stage hooks (.pre-commit-config.yaml)
        env:
          PROHIBITED_IDENTITY_CATALOG: ${{ vars.PROHIBITED_IDENTITY_CATALOG }}
        run: |
          set -euo pipefail
          if [ -n "${PROHIBITED_IDENTITY_CATALOG:-}" ]; then
            mkdir -p "$HOME/.config/agent-utilities/governance"
            printf '%s' "$PROHIBITED_IDENTITY_CATALOG" > "$HOME/.config/agent-utilities/governance/prohibited-identities.json"
          fi
          uvx --from pre-commit==4.6.0 pre-commit run --all-files --show-diff-on-failure
          uvx --from pre-commit==4.6.0 pre-commit run --hook-stage pre-push \
            --from-ref "$PRE_COMMIT_FROM_REF" --to-ref HEAD

      # External-index availability is a release boundary, not a PR/push
      # boundary. Repository-manager's one readiness primitive checks the
      # package versions that this wheel declares before a tag can build.
      - name: Checkout pinned release-readiness implementation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/repository-manager
          ref: 0671b97250c7a2e87a1f63b43818e99eb90709a1
          path: .uv-workspace-siblings/repository-manager
          persist-credentials: false

      - name: Release dependency readiness
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          rm_source="$GITHUB_WORKSPACE/.uv-workspace-siblings/repository-manager"
          mkdir -p "$rm_source/.uv-workspace-siblings"
          ln -s "$GITHUB_WORKSPACE/.uv-workspace-siblings/agent-utilities" "$rm_source/.uv-workspace-siblings/agent-utilities"
          uvx --from pre-commit==4.6.0 pre-commit run dependency-readiness --hook-stage manual --all-files

      # The numeric kernel builds into the epistemic-graph checkout's private
      # target-isolated/ dir (never CARGO_TARGET_DIR); cache exactly that dir.
      - name: Cache the epistemic-graph kernel build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/epistemic-graph -> target-isolated

      - name: Sync test environment
        run: |
          set -euo pipefail
          eg_source="$GITHUB_WORKSPACE/.uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/epistemic-graph"
          python -m pip install 'maturin>=1,<2'
          python "$eg_source/scripts/build_numeric_kernel.py"
          echo "PYTHONPATH=$eg_source${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          uv sync --frozen --extra test --extra webui --no-install-package epistemic-graph
          PYTHONPATH="$eg_source${PYTHONPATH:+:$PYTHONPATH}" uv run --no-sync python -c \
            'from pathlib import Path; import epistemic_graph; from epistemic_graph.generated import connector_pack, source_ingestion, storage; root = Path(".uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/epistemic-graph").resolve(); assert Path(epistemic_graph.__file__).resolve().is_relative_to(root); assert connector_pack.ConnectorPackStatusRequest; assert source_ingestion.SourceCheckpoint; assert storage.send_agent_component_content'

      - name: Locked-environment type check (manual-stage hook, always full)
        run: uvx --from pre-commit==4.6.0 pre-commit run mypy-env --hook-stage manual --all-files

      # Operator decision (2026-10-09): PR gates run a fast subset so a PR
      # auto-merges within minutes -- lint and the spec check already ran
      # full above (the commit-stage pre-commit step), the type check just
      # ran full too, and only the test matrix narrows here. `push` to main
      # and a release tag are never `pull_request` and keep running the full
      # suite unchanged via the manual-stage `pytest` hook, exactly as before.
      - name: Resolve pull-request test scope
        if: github.event_name == 'pull_request'
        id: pr-test-scope
        run: |
          set -euo pipefail
          uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' \
            pipelines-hook pr-test-scope --base-ref "$PRE_COMMIT_FROM_REF" \
            --src-root graph_os --tests-root tests > "$RUNNER_TEMP/pr-test-scope.txt"
          cat "$RUNNER_TEMP/pr-test-scope.txt"
          {
            echo "scope<<PR_TEST_SCOPE_EOF"
            cat "$RUNNER_TEMP/pr-test-scope.txt"
            echo "PR_TEST_SCOPE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Full test suite (push to main / release tag; manual-stage hook)
        if: github.event_name != 'pull_request'
        run: uvx --from pre-commit==4.6.0 pre-commit run pytest --hook-stage manual --all-files

      - name: Test suite -- pull request fast subset
        if: github.event_name == 'pull_request'
        env:
          SCOPE: ${{ steps.pr-test-scope.outputs.scope }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = "NONE" ]; then
            echo "pr-test-scope: no graph_os/tests change in this diff; skipping pytest"
          elif [ "$SCOPE" = "FULL" ]; then
            echo "pr-test-scope: unmapped source change (or an unreadable diff); running the full suite"
            scripts/local_hook.sh pytest
          else
            echo "pr-test-scope: running only the tests this diff affects:"
            echo "$SCOPE"
            mapfile -t affected_tests <<< "$SCOPE"
            scripts/local_hook.sh pytest "${affected_tests[@]}"
          fi

  scanner-quality:
    name: Scanner quality (cccc, KISS, dupehound, jscpd)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - *release-checkout
      - *release-python
      - *release-uv

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Resolve scanner cache identity
        id: scanner-cache-identity
        env:
          SCANNER_RECIPE: ${{ hashFiles('scripts/install_scanners.sh') }}
        run: |
          set -euo pipefail
          rustc_identity="$(rustc -Vv)"
          cargo_identity="$(cargo -V)"
          identity="$(printf '%s\0' \
            "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}" \
            "$SCANNER_RECIPE" "$rustc_identity" "$cargo_identity" \
            "$CARGO_BUILD_JOBS" "$CARGO_PROFILE_RELEASE_DEBUG" \
            "${RUSTFLAGS:-}" "${CARGO_ENCODED_RUSTFLAGS:-}" | sha256sum)"
          printf 'key=graph-os-scanners-v1-%s\n' "${identity%% *}" >> "$GITHUB_OUTPUT"

      - name: Restore scanner toolchain
        id: scanner-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/graph-os-scanners
          key: ${{ steps.scanner-cache-identity.outputs.key }}

      # Each scanner is installed to its own runner-local prefix at the
      # version the shared scanner-versions hook verifies (the same script
      # scripts/bootstrap.sh --scanners runs locally). Always run the installer:
      # a cache hit must still pass the provider's receipt and build probes.
      - name: Provision pinned scanner toolchain
        run: bash scripts/install_scanners.sh "$RUNNER_TEMP/graph-os-scanners" >> "$GITHUB_PATH"

      - *release-base

      - name: Shared scanner hooks (versions, censuses, clone differentials)
        env:
          CX_DUP_BASE_REF: ${{ env.PRE_COMMIT_FROM_REF }}
        run: |
          set -euo pipefail
          uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' \
            pipelines-hook scanner-versions cccc kiss dupehound jscpd
          for hook in complexity-census kiss-census dupehound-changed jscpd-differential jscpd-census; do
            uvx --from pre-commit==4.6.0 pre-commit run "$hook" --hook-stage manual --all-files
          done

      - name: Save verified scanner toolchain
        if: success() && steps.scanner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/graph-os-scanners
          key: ${{ steps.scanner-cache-identity.outputs.key }}

  build:
    name: build
    needs: [gates]
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - *release-checkout
      - *release-python
      - *release-uv

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-os-wheel
          path: dist/graph_os-*.whl
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: publish
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    # D-ORC-10-style gate (see agent-utilities release.yml): publishing is
    # irreversible, so it must never be a side effect of an ordinary green
    # push to main. Configure required-reviewer protection once on this
    # environment in Settings > Environments > pypi-publish.
    environment: pypi-publish
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: graph-os-wheel
          path: dist

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'

      - name: Publish wheel
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple dist/graph_os-*.whl
