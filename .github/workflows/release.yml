name: Release

# ─────────────────────────────────────────────────────────────────────────
# Modeled on agent-utilities'/epistemic-graph's release.yml two-workflow
# split: this file is the ONLY workflow that can block a release
# (gates -> build -> publish-pypi, wired with `needs:` so a failure names its
# stage at a glance). Scanner quality remains visible but advisory because its
# native toolchain is runner-provisioned. Everything else (Pages) lives in
# its own workflow.
#
# Every gate is a shared hook from Knuckles-Team/pipelines, run through
# pre-commit at the revision pinned in .pre-commit-config.yaml, so CI and the
# local hooks can never run different gate code. `scanner-quality` provisions
# the pinned cccc/kiss/dupehound/jscpd toolchain on the runner (hooks never
# install scanners) and runs the census and differential forms. The
# diff-scoped `complexity-staged` / `kiss-staged` hooks compare the staged
# index with HEAD, which is empty on a fresh checkout, so CI runs the census
# forms instead. The `ci-gate-replica` hook replays `gates` and `build`
# locally before a push.
#
# This pure-Python package has no native numeric-runtime gate. Container images
# have a separate delivery owner and are not published by this wheel workflow.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'graph_os/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      # YAML anchors, reused by `scanner-quality` and `build`: jscpd's
      # differential gate flags a copy-pasted preamble as a new same-file
      # duplicate; this is the fix, not a jscpd exclusion.
      - &release-checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - &release-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - &release-uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Checkout pinned agent-utilities source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/agent-utilities
          ref: 446e0cf11b5bce3e4b09488035800b91a7d60b25
          path: .uv-workspace-siblings/agent-utilities
          persist-credentials: false

      - name: Checkout pinned agent-connector-sdk source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/agent-connector-sdk
          ref: da1757b998698d2e8d5c60c4eca9aea18d9baf8d
          path: .uv-workspace-siblings/agent-connector-sdk
          persist-credentials: false

      - name: Checkout pinned agent-webui source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/agent-webui
          ref: a25478b4b1e892c5df8c5c79113ea37c89578053
          path: .uv-workspace-siblings/agent-webui
          persist-credentials: false

      - name: Checkout pinned epistemic-graph source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/epistemic-graph
          ref: 49d63da5396fef7482fc3617df3f90a836661722
          path: .uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/epistemic-graph
          persist-credentials: false

      - name: Materialize agent-webui's pinned AU source path
        run: |
          set -euo pipefail
          mkdir -p .uv-workspace-siblings/agent-webui/.uv-workspace-siblings
          cp -a .uv-workspace-siblings/agent-utilities .uv-workspace-siblings/agent-webui/.uv-workspace-siblings/agent-utilities

      # The base the differential hooks compare against: the pull request base
      # or the previous push, else the root commit (a first push scans all of
      # it). An unavailable object is never an invented empty baseline.
      - &release-base
        name: Resolve the published base
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "PRE_COMMIT_FROM_REF=$BASE" >> "$GITHUB_ENV"
          echo "CX_DUP_BASE_REF=$BASE" >> "$GITHUB_ENV"

      - name: Shared security, code-shape and hygiene hooks
        run: |
          set -euo pipefail
          for hook in secret-history dependency-audit security-sanitizer root-hygiene gitignore-convergence sprawl mermaid no-stub stubs env-sprawl stdout-writes swallowed-errors event-loop-blocking import-cycles ci-gate-replica-consistency; do
            uvx --from pre-commit==4.6.0 pre-commit run "$hook" --hook-stage manual --all-files
          done

      # The prohibited-identity catalog is operator-owned and never committed;
      # a missing catalog makes the hook fail closed.
      - name: Tracked-artifact privacy (identity catalog from the repository variable)
        env:
          PROHIBITED_IDENTITY_CATALOG: ${{ vars.PROHIBITED_IDENTITY_CATALOG }}
        run: |
          set -euo pipefail
          if [ -n "${PROHIBITED_IDENTITY_CATALOG:-}" ]; then
            mkdir -p "$HOME/.config/agent-utilities/governance"
            printf '%s' "$PROHIBITED_IDENTITY_CATALOG" > "$HOME/.config/agent-utilities/governance/prohibited-identities.json"
          fi
          uvx --from pre-commit==4.6.0 pre-commit run tracked-privacy --hook-stage manual --all-files

      - name: Sync test environment
        run: |
          set -euo pipefail
          eg_source="$GITHUB_WORKSPACE/.uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/epistemic-graph"
          test "$(git -C "$eg_source" rev-parse HEAD)" = "49d63da5396fef7482fc3617df3f90a836661722"
          echo "PYTHONPATH=$eg_source${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          uv sync --frozen --extra test --no-install-package epistemic-graph
          PYTHONPATH="$eg_source${PYTHONPATH:+:$PYTHONPATH}" uv run --no-sync python -c \
            'from pathlib import Path; import epistemic_graph; from epistemic_graph.generated import connector_pack, source_ingestion, storage; root = Path(".uv-workspace-siblings/agent-utilities/.uv-workspace-siblings/epistemic-graph").resolve(); assert Path(epistemic_graph.__file__).resolve().is_relative_to(root); assert connector_pack.ConnectorPackStatusRequest; assert source_ingestion.SourceCheckpoint; assert storage.send_agent_component_content'

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy graph_os

      - name: Test suite
        run: uv run --no-sync pytest

  scanner-quality:
    name: Scanner quality (cccc, KISS, dupehound, jscpd)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - *release-checkout
      - *release-python
      - *release-uv

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Each scanner is installed to its own runner-local --root/prefix at the
      # version the shared scanner-versions hook verifies.
      - name: Provision pinned scanner toolchain
        shell: bash
        run: |
          set -euo pipefail
          scanner_root="$RUNNER_TEMP/graph-os-scanners"
          mkdir -p "$scanner_root"
          # cccc 1.6.0 is not published to crates.io (cccc-cli stops at 1.0.0);
          # install the upstream v1.6.0 tag by its immutable commit.
          cargo install --locked --git https://github.com/moznion/cccc --rev d728759323be5d9977b7390a27133e8eaf481f26 --root "$scanner_root/cccc" cccc-cli
          cargo install --locked --version 0.4.10 --root "$scanner_root/kiss" kiss-ai
          cargo install --locked --version 0.1.2 --root "$scanner_root/dupehound" dupehound
          npm install --prefix "$scanner_root/npm" --no-package-lock --ignore-scripts --no-save --no-audit --no-fund \
            "jscpd@5.0.16"
          for bin_dir in "$scanner_root/cccc/bin" "$scanner_root/kiss/bin" "$scanner_root/dupehound/bin" "$scanner_root/npm/node_modules/.bin"; do
            echo "$bin_dir" >> "$GITHUB_PATH"
          done

      - *release-base

      - name: Shared scanner hooks (versions, censuses incl. orphan modules, clone differentials)
        run: |
          set -euo pipefail
          uvx --from 'git+https://github.com/Knuckles-Team/pipelines@35209bf6d85569a3c1fe3d5cd31771cacfdc3731' \
            pipelines-hook scanner-versions cccc kiss dupehound jscpd
          for hook in complexity-census kiss-census dupehound-changed jscpd-differential jscpd-census; do
            uvx --from pre-commit==4.6.0 pre-commit run "$hook" --hook-stage manual --all-files
          done

  build:
    name: build
    needs: [gates]
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - *release-checkout
      - *release-python
      - *release-uv

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-os-wheel
          path: dist/graph_os-*.whl
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: publish
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    # D-ORC-10-style gate (see agent-utilities release.yml): publishing is
    # irreversible, so it must never be a side effect of an ordinary green
    # push to main. Configure required-reviewer protection once on this
    # environment in Settings > Environments > pypi-publish.
    environment: pypi-publish
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: graph-os-wheel
          path: dist

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'

      - name: Publish wheel
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple dist/graph_os-*.whl
