name: Pages

# Builds and publishes the GitHub Pages site from docs/ (mkdocs). Advisory,
# never release-blocking — mirrors agent-utilities' two-workflow split
# (release.yml is the only workflow that can block a release; everything else,
# including Pages, lives outside it). Runs on documentation pushes to `main`.
#
# NOTE on action pinning: `actions/checkout` and `actions/setup-python` are
# pinned to the exact commit SHAs this repository's own release.yml uses
# (verified there). The three Pages-specific actions below are now pinned to
# full commit SHAs of each action's current release, and `pages`/`id-token`
# write is scoped to the `deploy` job only. The shared `supply-chain` hook
# enforces both properties.
on:
  push:
    branches:
      - 'main'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install mkdocs
        run: pip install "mkdocs>=1.6,<2"

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy docs site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
