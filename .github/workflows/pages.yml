name: Pages

on:
  push:
    branches:
      - main
    paths:
      - pages/**
      - .config/mkdocs-overrides/**
      - mkdocs.yml
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@main
    with:
      content_source: pages
      shared_theme_enabled: true
