# Combined pre-commit and pre-push suite for graph-os.
#
# Tool hooks are adopted from agent-utilities'/epistemic-graph's suites where
# they apply to a pure-Python package. Every repository-agnostic gate --
# complexity, KISS, clones, secrets, privacy, hygiene and code shape -- comes
# from the shared hook repository Knuckles-Team/pipelines at a pinned commit and
# is configured in pyproject.toml [tool.pipelines_hooks]; no gate script is
# copied into this repository. Shared hooks list `manual` so CI runs the
# identical pinned hook with `--hook-stage manual`. See AGENTS.md "Pre-commit
# hooks: adopted vs. dropped" for every AU/EG hook NOT reproduced here, and why.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: ^uv\.lock$
  - id: check-ast
    exclude: ^(tests/|test/)
  - id: check-yaml
    args: ["--unsafe"]
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
  - id: ruff-check
    args: ["--fix", "--unsafe-fixes"]
    exclude: ^(tests/|test/)
  - id: ruff-format
    exclude: ^(tests/|test/)

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: fc0f09a29bb495f4a91f00266155d6282d52485d # v1.20.2
  hooks:
  - id: mypy
    additional_dependencies: [pydantic==2.13.4, types-PyYAML==6.0.12.20260906]
    args: ["--ignore-missing-imports"]
    exclude: ^(tests/|test/)

- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: [".", "--min-confidence", "95", "--exclude", ".venv,build,tests"]

- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
    exclude: ^(tests/|test/)

- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    args: ["--skip", "B101"]
    exclude: ^(tests/|test/)

- repo: https://github.com/nbQA-dev/nbQA
  rev: d31b7eae1767c43460afb3ba130e0a6602933abe # 1.9.1
  hooks:
  - id: nbqa-ruff
    args: ["--fix"]

- repo: https://github.com/AleksaC/hadolint-py
  rev: 458cb25edf664682e3e856a53a2f9af33e068297 # v2.14.0
  hooks:
  - id: hadolint

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 6a280ba12b7901e47757c868c8c13c6a624c9ecb # 0.11.7
  hooks:
  - id: uv-lock
    args: ["--locked"]
    stages: [pre-push, manual]

# ── Shared gates (Knuckles-Team/pipelines, pinned) ─────────────────────────────
- repo: https://github.com/Knuckles-Team/pipelines
  rev: 8f9a755d97a4a03e069799fa853ba64c6bfecbf7 # refactor/shared-hooks (RF-ADR-009 SHARED-HOOKS)
  hooks:
  # scanners (pinned versions; never installed by a hook)
  - id: complexity-staged
    stages: [pre-commit, manual]
  - id: kiss-staged
    stages: [pre-commit, manual]
  - id: dupehound-changed
    stages: [pre-commit, manual]
  - id: complexity-census
    stages: [pre-push, manual]
  # also graph-os's Python orphan-module wiring gate (.kiss/kiss.toml
  # orphan_module_enabled = true): one whole-package pass, enforced
  - id: kiss-census
    stages: [pre-push, manual]
  - id: jscpd-differential
    stages: [pre-push, manual]
  - id: jscpd-census
    stages: [pre-push, manual]
  - id: scanner-versions
    stages: [pre-push, manual]
  # code shape
  - id: no-stub
    stages: [pre-commit, manual]
  - id: stubs
    exclude: ^tests/
    stages: [pre-commit, manual]
  - id: env-sprawl
    stages: [pre-commit, manual]
  - id: stdout-writes
    stages: [pre-commit, manual]
  - id: swallowed-errors
    stages: [pre-commit, manual]
  - id: event-loop-blocking
    stages: [pre-commit, manual]
  - id: import-cycles
    stages: [pre-commit, manual]
  # secrets, privacy, dependencies, hygiene
  - id: dependency-audit
    stages: [pre-commit, manual]
  - id: supply-chain
    stages: [pre-commit, manual]
  - id: secret-history
    stages: [pre-push, manual]
  - id: security-sanitizer
    stages: [pre-commit, manual]
  - id: tracked-privacy
    stages: [pre-commit, manual]
  - id: root-hygiene
    stages: [pre-commit, manual]
  - id: gitignore-convergence
    stages: [pre-commit, manual]
  - id: sprawl
    stages: [pre-commit, manual]
  - id: mermaid
    stages: [pre-commit, manual]
  - id: pre-commit-patch-safety
    stages: [pre-push, manual]
  # CI replica
  - id: ci-gate-replica-consistency
    stages: [pre-commit, manual]
  - id: ci-gate-replica
    stages: [pre-push]

- repo: local
  hooks:
  # RF-ADR-009 §3: fails when any declared or imported dependency points at a
  # LATER phase; graph-os is phase 5. It resolves the sibling
  # `repository-manager` checkout from `git rev-parse --git-common-dir` (the
  # shared git dir, stable across linked worktrees) rather than a
  # `$PWD`-relative path, which breaks in a worktree. Falls back to PyPI (CI).
  - id: dependency-readiness
    name: Dependency readiness — no declared/imported dependency points at a later RF-ADR-009 phase
    entry: >-
      bash -c '
      CANON_ROOT="$(cd "$(git rev-parse --git-common-dir)/.." && pwd)";
      P="$CANON_ROOT/../agents/repository-manager";
      [ -d "$P" ] || P=repository-manager;
      uv run --no-project --python 3.12 --prerelease=allow --with "$P" python -m repository_manager.dependency_readiness .
      '
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]

  - id: pytest
    name: pytest (full suite)
    entry: uv run --extra test python -m pytest
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
