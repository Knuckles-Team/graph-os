# Combined pre-commit and pre-push suite for graph-os, and the single source
# of the release workflow's gates: CI runs this file (commit and push stages
# over every file, then the manual-stage hooks that need the provisioned
# environment), so local and hosted runs execute the same gate code.
#
# Every repository-agnostic gate -- complexity, KISS, clones, secrets,
# privacy, hygiene and code shape -- comes from the shared hook repository
# Knuckles-Team/pipelines at main; repository-specific inputs are
# declared in pyproject.toml `[tool.pipelines_hooks]`. Hooks that need a
# sibling checkout or a synced environment (scripts/local_hook.sh) print
# `SKIPPED (<gate>): <reason>` in a fresh clone and fail closed under CI.
# Provision everything with scripts/bootstrap.sh.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: ^uv\.lock$
  - id: check-ast
    exclude: ^(tests/|test/)
  - id: check-yaml
    args: ["--unsafe"]
    # Helm templates are Go-template text with a .yaml extension, not parsed
    # as plain YAML until `helm template` renders them.
    exclude: ^deploy/helm/graph-os/templates/
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
  - id: ruff-check
    args: ["--fix", "--unsafe-fixes"]
  - id: ruff-format

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: fc0f09a29bb495f4a91f00266155d6282d52485d # v1.20.2
  hooks:
  - id: mypy
    additional_dependencies: [pydantic==2.13.4, types-PyYAML==6.0.12.20260906]
    args: ["--ignore-missing-imports"]
    exclude: ^(tests/|test/)

- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: [".", "--min-confidence", "95", "--exclude", ".venv,.uv-workspace-siblings,build,tests"]

- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
    exclude: ^(tests/|test/)

- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    args: ["--skip", "B101"]
    exclude: ^(tests/|test/)

- repo: https://github.com/nbQA-dev/nbQA
  rev: d31b7eae1767c43460afb3ba130e0a6602933abe # 1.9.1
  hooks:
  - id: nbqa-ruff
    args: ["--fix"]

- repo: https://github.com/AleksaC/hadolint-py
  rev: 458cb25edf664682e3e856a53a2f9af33e068297 # v2.14.0
  hooks:
  - id: hadolint

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 6a280ba12b7901e47757c868c8c13c6a624c9ecb # 0.11.7
  hooks:
  - id: uv-lock
    args: ["--locked"]
    # Hosted release gates verify the frozen lock after pinned source checkout.
    stages: [manual]

# ── Shared gates (Knuckles-Team/pipelines, main) ─────────────────────────────
- repo: https://github.com/Knuckles-Team/pipelines
  rev: main # sanctioned first-party exception; public-surface gate
  hooks:
  # scanners (pinned versions; never installed by a hook)
  - id: complexity-staged
    stages: [pre-commit, manual]
  - id: kiss-staged
    stages: [pre-commit, manual]
  - id: dupehound-changed
    stages: [pre-commit, manual]
  - id: complexity-census
    stages: [manual]
  # Orphan modules are NOT covered here since kiss 0.4.11 (the check moved
  # to the coverage-linked `kiss test`); graph-os's Python orphan-module
  # wiring gate is the check-orphan-modules local hook below.
  - id: kiss-census
    stages: [manual]
  - id: jscpd-differential
    stages: [manual]
  - id: jscpd-census
    stages: [manual]
  - id: scanner-versions
    stages: [manual]
  # code shape
  - id: no-stub
    stages: [pre-commit, manual]
  - id: stubs
    exclude: ^tests/
    stages: [pre-commit, manual]
  - id: env-sprawl
    stages: [pre-commit, manual]
  - id: stdout-writes
    stages: [pre-commit, manual]
  - id: swallowed-errors
    stages: [pre-commit, manual]
  - id: event-loop-blocking
    stages: [pre-commit, manual]
  - id: import-cycles
    stages: [pre-commit, manual]
  # public documentation
  - id: public-surface
    stages: [pre-commit, manual]
  # secrets, privacy, supply chain, hygiene
  - id: supply-chain
    stages: [pre-commit, manual]
  - id: secret-history
    stages: [pre-push, manual]
  - id: security-sanitizer
    stages: [pre-commit, manual]
  - id: tracked-privacy
    stages: [pre-commit, manual]
  - id: root-hygiene
    stages: [pre-commit, manual]
  - id: gitignore-convergence
    stages: [pre-commit, manual]
  - id: sprawl
    stages: [pre-commit, manual]
  - id: mermaid
    stages: [pre-commit, manual]
  - id: pre-commit-patch-safety
    stages: [pre-push, manual]

- repo: local
  hooks:
  # Release readiness checks the external package index, which may lag source
  # commits. The release workflow runs it on version tags only; run it
  # explicitly before a release. Without a repository-manager checkout it is
  # SKIPPED locally and CANNOT RUN (exit 2) under CI.
  - id: dependency-readiness
    name: Dependency readiness - declared and imported dependencies respect layer order
    entry: scripts/local_hook.sh dependency-readiness
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]

  # The isolated mypy hook above ignores missing imports; this one checks
  # graph_os against the real locked dependency types.
  - id: mypy-env
    name: mypy (locked environment)
    entry: scripts/local_hook.sh mypy-env
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]

  # Needs the sibling source checkouts and the synced environment that
  # scripts/bootstrap.sh provisions; SKIPPED locally without them.
  - id: pytest
    name: pytest (full suite)
    entry: scripts/local_hook.sh pytest
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]

- repo: local
  hooks:
  # graph-os's Python orphan-module wiring gate (see .config/kiss.toml
  # [global] and AGENTS.md "Orphan-module wiring gate (Python)"): a
  # graph_os/ module with no production fan-in and no production fan-out
  # (on disk, tracked or not). Needs only the stdlib (ast, tomllib), so it
  # runs in a fresh clone with no synced environment.
  - id: check-orphan-modules
    name: Wiring — no orphan graph_os module
    entry: python3 scripts/check_wiring.py orphans
    language: system
    pass_filenames: false
    always_run: true
  # Reports graph_os/ modules no declared root (console script, entry point,
  # or the top-level package) reaches by any import edge -- static or
  # dynamic/name-based (see scripts/wiring/reachability.py). This is staged,
  # not-yet-served code: nonzero fan-in/fan-out lets a module pass
  # check-orphan-modules above even when nothing running ever reaches it.
  # Manual stage only -- it reports, it never blocks CI.
  - id: check-unreachable-modules
    name: Wiring — report graph_os modules no entry point reaches (not served yet)
    entry: python3 scripts/check_wiring.py unreachable
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  - id: check-public-specs
    name: Public specs are self-contained and locally linked
    entry: python3 scripts/check_public_specs.py
    language: system
    pass_filenames: false
    files: ^(specs/|scripts/check_public_specs\.py$|\.specify/memory/constitution\.md$)
